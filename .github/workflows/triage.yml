name: Issue Triage

# Auto-triages every opened issue with Claude, which reads the repository through
# read-only tools: applies a category label and posts a summary, code pointers and
# possible duplicates, acting as spotatui[bot]. A `good first issue` also gets
# step-by-step start instructions for new contributors. No maintainer approval
# step: the run generates and applies in one pass. See .github/scripts/triage.mjs.

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to triage"
        required: true

permissions:
  contents: read

concurrency:
  group: triage-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    # id-token lets the script exchange a GitHub OIDC token for a short-lived
    # Anthropic token (workload identity federation), so no API key is stored.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install the Anthropic SDK
        working-directory: .github/scripts
        run: npm ci --ignore-scripts
      - name: Mint spotatui[bot] token (issues:write only)
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SPOTATUI_APP_ID }}
          private-key: ${{ secrets.SPOTATUI_APP_KEY }}
          permission-issues: write
          permission-metadata: read
      - name: Resolve issue number
        id: n
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        run: echo "number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Gather issue + open and closed issues
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          N: ${{ steps.n.outputs.number }}
        run: |
          gh issue view "$N" --repo "$REPO" --json number,title,body,labels > issue.json
          gh issue list --repo "$REPO" --state open --limit 100 --json number,title,body > open-issues.json
          gh issue list --repo "$REPO" --state closed --limit 100 --json number,title,body > closed-issues.json
      - name: Triage with Claude
        shell: bash
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
        # tee also echoes the triage JSON into the step log for easy inspection.
        run: node .github/scripts/triage.mjs | tee triage.json
      - name: Apply label + comment as spotatui[bot]
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          N: ${{ steps.n.outputs.number }}
        run: |
          node .github/scripts/triage.mjs --render | tee comment.md
          gh issue comment "$N" --repo "$REPO" --body-file comment.md
          labels=$(node -e 'process.stdout.write(require("./triage.json").labels.join(","))')
          if [ -n "$labels" ]; then
            gh issue edit "$N" --repo "$REPO" --add-label "$labels"
          fi
