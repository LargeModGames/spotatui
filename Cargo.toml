[package]
name = "degen-radio"
description = "An internet-radio terminal player with MPRIS control"
homepage = "https://github.com/ethereumdegen/degen-radio"
documentation = "https://github.com/ethereumdegen/degen-radio"
repository = "https://github.com/ethereumdegen/degen-radio"
keywords = ["radio", "audio", "tui", "terminal"]
categories = ["command-line-utilities"]
version = "0.43.0-radio.1"
authors = ["ethereumdegen"]
edition = "2021"
license = "MIT"
default-run = "degen-radio"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6", features = ["cargo"] }
crossterm = { version = "0.29", optional = true }
dirs = "6.0"
fern = "0.7.1"
icy-metadata = { version = "0.6", optional = true, default-features = false }
log = "0.4.32"
rand = "0.10.2"
ratatui = { version = "0.30", features = ["crossterm", "layout-cache"], default-features = false, optional = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rodio = { version = "0.22", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
stream-download = { version = "0.24", optional = true, default-features = false, features = ["reqwest-rustls"] }
tokio = { version = "1.52", features = ["full"] }
url = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "0.10", optional = true }

[features]
default = ["tui", "internet-radio", "mpris"]
tui = ["dep:ratatui", "dep:crossterm"]
audio-decode = ["dep:rodio"]
internet-radio = ["audio-decode", "dep:stream-download", "dep:icy-metadata"]
mpris = ["dep:mpris-server"]

[dev-dependencies]
tempfile = "3"

[lib]
name = "degen_radio"
path = "src/lib.rs"

[[bin]]
bench = false
path = "src/bin/degen-radio.rs"
name = "degen-radio"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[package.metadata.deb]
maintainer = "ethereumdegen"
copyright = "2026 ethereumdegen"
license-file = ["LICENSE", "4"]
depends = "$auto"
section = "sound"
priority = "optional"
assets = [
  ["target/release/degen-radio", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/degen-radio/README", "644"],
]
